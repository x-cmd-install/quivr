47b3656dded77db1d589139ca8e2123","download_count":3,"created_at":"2026-10-29T16:36:04Z","updated_at":"2026-10-29T16:36:04Z"},{"id":689189895,"node_id":"RA_kwDOJibVLc4pFDQH","name":"quivr-tei.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":2848562,"digest":"sha256:67e1a973c792d5bef1fc759e627b99b3cce98db1112066f7046d9ec04809c5f9","download_count":3,"created_at":"2026-10-29T16:36:04Z","updated_at":"2026-10-29T16:36:04Z"},{"id":689189894,"node_id":"RA_kwDOJibVLc4pFDQG","name":"quivr-web.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":2935416,"digest":"sha256:804a4d61920d85b5c2c0dc49d6f7284e0fb637f99d2d5b4c563f05f02b116c55","download_count":3,"created_at":"2026-10-29T16:36:04Z","updated_at":"2026-10-29T16:36:04Z"},{"id":689189904,"node_id":"RA_kwDOJibVLc4pFDQQ","name":"quivr.spdx.json","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/json","state":"uploaded","size":115294,"digest":"sha256:67fbd23bb9c61f7f2cdbee209002e5cce864207d803f15762dd1a79dd874185b","download_count":4,"created_at":"2026-10-29T16:36:04Z","updated_at":"2026-10-29T16:36:04Z"}],"body":"## Quivr 2.0.0\n\nQuivr is an open-source engine for content that keeps arriving. Your application, or Quivr's sources (RSS, Microsoft 365 mailboxes, X lists), send it documents. Quivr keeps every version of each document and makes it searchable within seconds, by keywords, by meaning, or both. It also checks every new document against your saved alerts. Quivr has no user interface: your application talks to it over an HTTP API, and AI agents use it through `quivr mcp`.\n\n2.0.0 is the first stable release of the rewritten Quivr. The alphas were for evaluation. From this release on, Quivr makes promises you can build on.\n\n### What 2.0 promises\n\n- **A stable API.** The HTTP API keeps the `/v0` path for every 2.x release. A 2.x release only adds to it: new endpoints, optional fields, response fields and enum values. A change that could break a working client waits for the next major release.\n- **Upgrades that keep your data.** An upgrade from one 2.x release to another runs `quivr migrate`, then rolls the worker and the API, with your data in place.\n- **Plugins that check their compatibility.** A plugin declares the Plugin API versions it supports, and Quivr refuses to activate one it cannot run.\n- **Clear status for each feature.** Everything in the documentation is stable within 2.x except a short list of experimental features, each marked on its page: search measurement tooling, Jev re-ranking and Jev-judged alerts, the dedicated vector host, and the `quivr-autoscaler` binary.\n\n[Versions and compatibility](https://docs.quivr.thevibecompany.co/reference/compatibility) has the details. [Known limits](https://docs.quivr.thevibecompany.co/reference/known-limits) lists what 2.0 does not do yet: it searches text only, has no OCR, has no user accounts, and has size limits per document and per search.\n\n### Get started\n\n- **Try it locally:** clone the repository, run `make dev`, then follow the [Quickstart](https://docs.quivr.thevibecompany.co/quickstart), about fifteen minutes.\n- **Install it on a server** from the signed release images (`linux/amd64`): see [Run Quivr on one machine](https://docs.quivr.thevibecompany.co/run-quivr/single-machine), or [Deploy and configure Quivr](https://docs.quivr.thevibecompany.co/run-quivr/deploy) for Railway and Kubernetes.\n- **Understand it first:** [Core concepts](https://docs.quivr.thevibecompany.co/concepts) and [How Quivr works](https://docs.quivr.thevibecompany.co/how-quivr-works).\n\n### Coming from a 2.0.0 alpha\n\nUpgrading an alpha installation in place is not supported. Start a fresh 2.0.0 installation, or export your documents from the alpha and send them to the new one.\n\n### Since 2.0.0-alpha.7\n\n- **Security:**\n  - Quivr and its images are built with Go 1.27.3, for CVE-2026-111943;\n  - `golang.org/x/net`, `certifi`, `pillow`, and the SeaweedFS image's `curl` and `brotli` are patched.\n- **Search** recovers after a database restart, with its buffers restored and its hydration work bounded.\n- **Imports:**\n  - queue counts stay available during continuous imports;\n  - the autoscaler adds bulk workers for connector imports.\n- **Documentation:**\n  - rewritten for newcomers, with new pages: How Quivr works, a glossary, Versions and compatibility, and Known limits;\n  - the \"evaluation stage\" warnings are gone.\n\nThe full list of changes since the first alpha is in [CHANGELOG.md](https://github.com/The-Vibe-Company/quivr/blob/main/CHANGELOG.md).\n\n---\n\n### Changes since 2.0.0-alpha.7 (generated)\n\n\n#### Features\n\n* **docs-site:** add PostHog analytics to the documentation site ([#3954](https://github.com/The-Vibe-Company/quivr/issues/3954)) ([1f72133](https://github.com/The-Vibe-Company/quivr/commit/1f72133e27e1cc0a7a05fb35a93df0f9e33136c4))\n\n\n#### Bug Fixes\n\n* **autoscaling:** scale bulk workers at connector prefetch bound ([#3952](https://github.com/The-Vibe-Company/quivr/issues/3952)) ([8a58f13](https://github.com/The-Vibe-Company/quivr/commit/8a58f134b60c0ce647b59e95e46458560a52bcbb))\n* **queues:** preserve bounded snapshots during continuous imports ([#3951](https://github.com/The-Vibe-Company/quivr/issues/3951)) ([90e7c63](https://github.com/The-Vibe-Company/quivr/commit/90e7c6389610eee01f3786d58f16d3426707a4f1))\n* **release:** check out before downloading signed images in publish ([#3971](https://github.com/The-Vibe-Company/quivr/issues/3971)) ([313f51e](https://github.com/The-Vibe-Company/quivr/commit/313f51e361b737f7986522493e26f0f1fa411ef7))\n* **search:** restore buffers and bound hydration after restart ([#3953](https://github.com/The-Vibe-Company/quivr/issues/3953)) ([ec80407](https://github.com/The-Vibe-Company/quivr/commit/ec80407fe05828729efb00665d1e026a0a5b1cb2))\n* **security:** build with Go 1.27.3 and patch vulnerable dependencies ([#3967](https://github.com/The-Vibe-Company/quivr/issues/3967)) ([426bc62](https://github.com/The-Vibe-Company/quivr/commit/426bc62b4ef368fa858ca6a435133610be3fe954))\n\n\n#### Miscellaneous Chores\n\n* **release:** prepare Quivr 2.0.0 ([#3968](https://github.com/The-Vibe-Company/quivr/issues/3968)) ([5bb5690](https://github.com/The-Vibe-Company/quivr/commit/5bb56905eeaae51e95ad6e5b7822b80220004f2b))\n"}
